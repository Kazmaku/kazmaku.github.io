<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/</title>
    <link rel="stylesheet" href="./asset/CSS/style.css">
</head>

<body>
    <div class="container">
        <div class="profile">
            <img src="./asset/img/nl_ws.png" alt="avatar" class="avatar">
            <div>
                <h1>/Kazmaku</h1>
                <p class="bio">「<span class="emphasis">Can you hear the music?</span>」</p>
            </div>
        </div>

        <div class="links">
            <a href="https://github.com/Kazmaku/" class="link">
                <svg height="16" viewBox="0 0 16 16" width="16" fill="currentColor">
                    <path
                        d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z">
                    </path>
                </svg>
                GitHub
            </a>
        </div>

        <div class="about">
            <p><span class="emphasis">專注本質</span>。簡化繁複。</p>
        </div>

        <div id="skills" class="skills">
        </div>

        <div id="projects" class="projects">
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                const skillsResponse = await fetch('./asset/data/skills.json');
                const skillsData = await skillsResponse.json();
                const skillsContainer = document.getElementById('skills');

                skillsData.skills.forEach(skill => {
                    const skillElement = document.createElement('span');
                    skillElement.className = 'skill';
                    skillElement.textContent = skill;
                    skillsContainer.appendChild(skillElement);
                });

                const projectsResponse = await fetch('./asset/data/projects.json');
                const projectsData = await projectsResponse.json();
                const projectsContainer = document.getElementById('projects');

                projectsData.projects.forEach(project => {
                    const projectElement = document.createElement('div');
                    projectElement.className = 'project';
                    projectElement.innerHTML = `
                        <div class="project-title">${project.title}</div>
                        <div class="project-desc">${project.description}</div>
                    `;
                    projectsContainer.appendChild(projectElement);
                });
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>

</html>
